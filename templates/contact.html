{% extends "base.html" %}
{% block title %}Contact Us{% endblock title %}

        {% block body %}
       
<h1 class="text-center">Contact Us</h1>
<div class="container mt-2">
        {% for message in messages %}
        <div class="alert alert-{{message.tags}} alert-dismissible fade show" role="alert">
               <strong> {{ message }}</strong>
               <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
        <div class="row">
                <div class="col-md-4"></div>
                <div class="col-md-4">
                        <form action="/contact/" method="post">
                                {% csrf_token %}
                                <br />
                                
                                        <label for="name" class="form-label"> Full Name</label>
                                        <div class="form-group">
                                                <input type="text" class="form-control p-2" id="name" name="name" required>
                                        </div>
                                        <label for="email" class="form-label">Email</label>
                                        <div class="form-group">
                                                <input type="email" class="form-control p-2" id="email" name="email" value="{{user.email}}" required>
                                        </div>
                                        <label for="description" class="form-label">How Can I Help You?</label>
                                        <div class="form-group">
                                                <input type="text" class="form-control p-2" id="description" name="description" required>
                                        </div>


                                        <label for="phonenumber" class="form-label">Phone Number</label>
                                        <div class="form-group">
                                                <input type="text" class="form-control p-2" id="phonenumber" name="phonenumber" required><br/>
                                        </div>
                                <button type="submit" class="btn btn-primary">Submit</button>
                        </form>






                </div>
                <div class="col-md-4"></div>
        </div>

</div>

{% endblock body %}
